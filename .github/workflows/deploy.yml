# Adapted from the Lab 5 starter kit. Runs only after the GitHub environment `demo` has
# its variables (Workload Identity Federation, Lab 5 step 6, GCP side).
#
# Deploy demo: automatic deployment to Google Cloud Run.
# On every push to `main` (or a manual run) it:
#   1) runs the CI workflow (ci-docker.yml, job `test-and-docker`) first,
#   2) logs in to Google Cloud without a key file (Workload Identity Federation),
#   3) builds and pushes the image tagged with the full commit SHA,
#   4) runs deploy/release.sh (verify image -> migrate -> update service),
#   5) smoke-tests the public URL (deploy/smoke_test.py),
#   6) writes a deployment summary.
# Manual rollback: run the workflow by hand and enter `image_tag` = the full 40-character
# commit SHA of an image that already exists. Tests, build and migration are skipped.
#
# Names the lab guide refers to (do not rename): job `test-and-docker` (in ci-docker.yml),
# environment `demo`, variables GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT.
# No secret lives in this file. Values come from Settings > Environments > demo.
#
# The Cloud Run service `adviseslot`, the migrate job `adviseslot-migrate` and the Artifact
# Registry repo `adviseslot` are created once by deploy/deploy.sh; this workflow only
# updates them (deploy/release.sh).

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: full commit SHA of an existing image. Empty = test, build and deploy current main.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Queue releases; never interrupt a running migration or deployment.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  # Runs the CI workflow (job id `test-and-docker`). Skipped for rollbacks and non-main refs.
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  # Only runs if the tests passed (or this is a manual rollback).
  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write # keyless Google Cloud login (WIF)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: adviseslot
      MIGRATE_JOB_NAME: adviseslot-migrate
      # Image tag = commit SHA (or the rollback SHA that was typed in).
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION"
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full 40-character commit SHA.'; exit 1; }

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Skipped for rollbacks. The image path adviseslot/adviseslot is
      # <Artifact Registry repo>/<image name>; it must match deploy/release.sh.
      - name: Build and push image
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/adviseslot/adviseslot:$IMAGE_TAG"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # Verify image -> run migration job -> update the Cloud Run service.
      # Exports SERVICE_URL and DEPLOYED_IMAGE for the next steps.
      - name: Verify image, migrate and deploy
        run: bash deploy/release.sh

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Smoke test public URL
        env:
          # Optional login check: set BOTH (variable + secret) or neither. Use a dedicated
          # demo account (for example student1@example.test), never a real person's.
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record deployment
        run: |
          {
            echo '### AdviseSlot demo deployment'
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DEPLOYED_IMAGE\`"
            echo "- Rollback: $ROLLBACK"
            echo "- URL: $SERVICE_URL"
            echo '- Smoke test: passed.'
          } >> "$GITHUB_STEP_SUMMARY"
